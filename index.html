<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation Movie</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  }

  #video-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
  }

  iframe {
    width: 100%;
    height: 100%;
  }

  #thanks {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      #fff7f9 0%,
      #fdeff2 50%,
      #fbdde6 100%
    );
    color: #444;
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }

  #message {
    font-size: 24px;
    line-height: 1.9;
  }
</style>
</head>
<body>

<div id="video-wrapper">
  <iframe 
    id="ytplayer"
    src="https://www.youtube.com/watch?v=iXxJ8RaZRgI"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>
</div>

</body>
</html>
